<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX // DZIENNIK_TRENINGOWY_V13</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ff41">
    <style>
        /* [SEKCJA CSS]: STYLIZACJA INTERFEJSU MATRIX & TOTAL COMMANDER */
        body { 
            font-family: 'Consolas', 'Courier New', monospace; 
            background-color: #000000; 
            color: #00ff41; 
            margin: 0; 
            padding: 10px 10px 60px 10px; 
            color-scheme: dark;
        }

        .card { 
            background: #0d0d0d; 
            border: 1px solid #00ff41; 
            padding: 12px; 
            margin-bottom: 12px; 
            border-radius: 0px; 
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.2);
        }

        h1 { font-size: 20px; color: #00ff41; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px dashed #00ff41; padding-bottom: 5px; }
        h2 { font-size: 15px; color: #ffffff; margin-top: 0; margin-bottom: 10px; text-transform: uppercase; background: #003311; padding: 4px 8px; display: inline-block; }
        label { display: block; margin: 8px 0 4px 0; font-size: 12px; font-weight: bold; color: #00aa33; text-transform: uppercase; }

        select, input, button { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 10px; 
            border-radius: 0px; 
            border: 1px solid #00ff41; 
            box-sizing: border-box; 
            font-size: 14px; 
            font-family: 'Consolas', 'Courier New', monospace;
            background: #000000; 
            color: #00ff41; 
        }
        select:focus, input:focus { outline: none; background: #051a05; box-shadow: 0 0 10px #00ff41; }
        select option { background: #0d0d0d; color: #00ff41; }

        button { background: #004411; color: #00ff41; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        button:hover { background: #00ff41; color: #000000; box-shadow: 0 0 12px #00ff41; }
        
        .accent-btn { background: #002244; border-color: #0088ff; color: #0088ff; }
        .accent-btn:hover { background: #0088ff; color: #000000; box-shadow: 0 0 12px #0088ff; }
        
        .delete-btn { background: #440000; border-color: #ff3333; color: #ff3333; padding: 4px 8px; width: auto; font-size: 12px; margin: 0; }
        .delete-btn:hover { background: #ff3333; color: #000000; box-shadow: 0 0 12px #ff3333; }
        
        .backup-btn { background: #330044; border-color: #cc00ff; color: #cc00ff; margin-bottom: 8px; }
        .backup-btn:hover { background: #cc00ff; color: #000000; box-shadow: 0 0 12px #cc00ff; }

        .flex-row { display: flex; justify-content: space-between; align-items: center; background: #050505; border: 1px solid #005511; padding: 8px; margin-top: 5px; }
        .last-session { background: #1a1500; border-left: 4px solid #ffcc00; color: #ffcc00; padding: 10px; margin-bottom: 12px; font-size: 13px; }
        .summary-box { background: #001a14; border-left: 4px solid #00ffcc; color: #00ffcc; padding: 8px; margin-bottom: 5px; font-size: 13px; }

        .compact-card { padding: 8px; }
        .compact-card h2 { font-size: 13px; background: #111; border: 1px solid #333; color: #00ff41; }
        .compact-row { padding: 4px 6px; font-size: 12px; border-color: #003311; }

        .clickable-card { cursor: pointer; }
        .history-header { display: flex; justify-content: space-between; align-items: center; }
        .collapse-content { display: none; margin-top: 8px; }
        .arrow-indicator { font-size: 12px; color: #00ff41; }

        .version-tag { font-size: 10px; color: #005511; text-align: center; margin-top: 15px; }
        .nuclear-link { color: #ff3333; cursor: pointer; text-decoration: underline; margin-left: 10px; }

        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #111111; 
            display: flex; 
            border-top: 1px solid #00ff41; 
            z-index: 1000; 
            padding: 2px;
        }
        .nav-item { 
            flex: 1; 
            text-align: center; 
            padding: 10px 0; 
            font-weight: bold; 
            color: #00ff41; 
            background: #000000;
            cursor: pointer; 
            font-size: 12px; 
            margin: 2px;
            border: 1px solid #003311;
        }
        .nav-item.active { 
            color: #000000; 
            background: #00ff41; 
            border-color: #00ff41;
            box-shadow: 0 0 8px #00ff41;
        }
        
        .app-page { display: none; }
        .app-page.active { display: block; }
    </style>
</head>
<body>

    <div class="header-area">
        <h1 id="app-title">> SYS_OP: WORKOUT_LOG_V13</h1>
    </div>

    <!-- STRONA 1: TRENING -->
    <div id="page-workout" class="app-page active">
        <div class="card">
            <h2>[01] ZAPISZ_SERIĘ</h2>
            
            <label for="categorySelect">> KAT_CIALO:</label>
            <select id="categorySelect" onchange="updateExerciseDropdown()"></select>

            <label for="exerciseSelect">> CWICZENIE:</label>
            <select id="exerciseSelect" onchange="onExerciseChange()"></select>
            
            <div id="lastSessionInfo" class="last-session">HISTORY_EMPTY</div>
            
            <label for="repsInput">> POWTORZENIA (REPS):</label>
            <input type="number" id="repsInput" placeholder="0" inputmode="numeric">

            <label for="weightInput">> CIEZAR_KG (WEIGHT):</label>
            <input type="number" id="weightInput" placeholder="0.0" step="0.5" inputmode="decimal">
            
            <button onclick="addSet()">[ ENTER ] DODAJ SERIĘ</button>
        </div>

        <div class="card compact-card">
            <h2>[02] DZISIEJSZE_SERIE</h2>
            <div id="todaySetsList"></div>
        </div>

        <div class="version-tag">
            CORE_VER: v13_HIERARCHY | <span class="nuclear-link" onclick="forceNuclearReset()">[SYS_RESET]</span>
        </div>
    </div>

    <!-- STRONA 2: HISTORIA -->
    <div id="page-history" class="app-page">
        <div class="card">
            <h2>[03] DATA_BACKUP_SYSTEM</h2>
            <button class="backup-btn" onclick="exportData()">💾 EKSPORT_DO_PLIKU (.JSON)</button>
            <button class="backup-btn" onclick="document.getElementById('importFileInput').click()">📂 IMPORT_Z_PLIKU (.JSON)</button>
            <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importData(event)">
        </div>

        <div id="historyContainer"></div>
    </div>

    <!-- STRONA 3: USTAWIENIA -->
    <div id="page-exercises" class="app-page">
        <div class="card">
            <h2>[04] ZARZADZAJ_PARTIAMI</h2>
            <input type="text" id="newCategoryName" placeholder="NAZWA PARTII...">
            <button class="accent-btn" onclick="addCategory()">DODAJ PARTIĘ</button>
            <div id="customCategoriesList"></div>
        </div>

        <div class="card">
            <h2>[05] NOWE_CWICZENIE</h2>
            <input type="text" id="newExerciseName" placeholder="NAZWA CWICZENIA...">
            <label for="newExerciseCategory">> PRZYPISZ_DO_PARTII:</label>
            <select id="newExerciseCategory"></select>
            <button class="accent-btn" onclick="addExercise()">DODAJ CWICZENIE</button>
        </div>

        <div class="card">
            <h2>[06] BAZA_CWICZEN</h2>
            <div id="customExercisesList"></div>
        </div>
    </div>

    <div class="nav-bar">
        <div id="nav-workout" class="nav-item active" onclick="switchPage('workout', '> SYS_OP: WORKOUT_LOG')">F3 TRENING</div>
        <div id="nav-history" class="nav-item" onclick="switchPage('history', '> SYS_OP: HISTORY_DB')">F4 HISTORIA</div>
        <div id="nav-exercises" class="nav-item" onclick="switchPage('exercises', '> SYS_OP: SYS_CONFIG')">F5 USTAWIE</div>
    </div>

    <script>
        /* [LOGIKA JAVASCRIPT]: ZMIENNE I FUNKCJE SYSTEMOWE */
        let categories = JSON.parse(localStorage.getItem('categories')) || ["Klatka", "Plecy", "Biceps", "Triceps", "Nogi", "Brzuch"];

        const defaultExercises = [
            { name: "Wyciskanie na płaskiej", category: "Klatka" },
            { name: "Martwy ciąg", category: "Plecy" },
            { name: "Przysiad ze sztangą", category: "Nogi" }
        ];

        let exercises = JSON.parse(localStorage.getItem('exercises')) || defaultExercises;
        let dataLog = JSON.parse(localStorage.getItem('dataLog')) || [];

        function init() {
            updateCategoryDropdowns();
            updateExerciseDropdown();
            renderTodaySets();
            renderCustomExercisesList();
            renderCustomCategoriesList();
            renderHistory();
        }

        function forceNuclearReset() {
            const wantBackup = confirm("[SYS_WARNING] Czy pobrać kopię zapasową JSON przed formatowaniem baz danych?");
            if (wantBackup) { exportData(); }
            if (confirm("[SYS_DANGER] Całkowite czyszczenie pamięci podręcznej i bazy. Kontynuować?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        function addCategory() {
            const input = document.getElementById('newCategoryName');
            const name = input.value.trim();
            if (name && !categories.includes(name)) {
                categories.push(name);
                saveCategories();
                input.value = '';
                init();
            } else if(categories.includes(name)) { alert("[ERROR] Partia już istnieje."); }
        }

        function deleteCategory(index) {
            const catToDelete = categories[index];
            const hasExercises = exercises.some(ex => ex.category === catToDelete);
            if (hasExercises) {
                alert(`[BLOKADA_SYSTEMU] Partia "${catToDelete}" posiada przypisane ćwiczenia.`);
                return;
            }
            if (confirm(`Usunąć partię: "${catToDelete}"?`)) {
                categories.splice(index, 1);
                saveCategories();
                init();
            }
        }

        function renderCustomCategoriesList() {
            const container = document.getElementById('customCategoriesList');
            if(!container) return;
            container.innerHTML = '';
            categories.forEach((cat, index) => {
                const div = document.createElement('div');
                div.className = 'flex-row';
                div.innerHTML = `<span><strong>${cat}</strong></span> <button class="delete-btn" onclick="deleteCategory(${index})">USUŃ</button>`;
                container.appendChild(div);
            });
        }

        function saveCategories() { localStorage.setItem('categories', JSON.stringify(categories)); }
        function saveExercises() { localStorage.setItem('exercises', JSON.stringify(exercises)); }
        function saveDataLog() { localStorage.setItem('dataLog', JSON.stringify(dataLog)); }

        function switchPage(pageId, titleText) {
            document.querySelectorAll('.app-page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.getElementById(`nav-${pageId}`).classList.add('active');
            document.getElementById('app-title').textContent = titleText;
            if(pageId === 'history') renderHistory();
            if(pageId === 'workout') { renderTodaySets(); onExerciseChange(); }
        }

        function updateCategoryDropdowns() {
            const catSelect = document.getElementById('categorySelect');
            const newCatSelect = document.getElementById('newExerciseCategory');
            if(catSelect) {
                catSelect.innerHTML = '';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat; option.textContent = cat;
                    catSelect.appendChild(option);
                });
            }
            if(newCatSelect) {
                newCatSelect.innerHTML = '';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat; option.textContent = cat;
                    newCatSelect.appendChild(option);
                });
            }
        }

        function updateExerciseDropdown() {
            const selectedCat = document.getElementById('categorySelect').value;
            const select = document.getElementById('exerciseSelect');
            if(!select) return;
            select.innerHTML = '';
            const filteredExercises = exercises.filter(ex => ex.category === selectedCat);
            filteredExercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex.name; option.textContent = ex.name;
                select.appendChild(option);
            });
            onExerciseChange();
        }

        function onExerciseChange() {
            updateLastSessionView();
            autoFillInputs();
        }

        /* 1. MODYFIKACJA: LOGIKA BLOKU "OSTATNIO" NA STRONIE TRENINGU */
        function updateLastSessionView() {
            const selectedExercise = document.getElementById('exerciseSelect').value;
            const infoBox = document.getElementById('lastSessionInfo');
            if (!selectedExercise) { infoBox.innerHTML = "Wybierz lub dodaj ćwiczenie."; return; }
            
            // Pobieramy dzisiejszą datę w formacie tekstowym
            const today = new Date().toLocaleDateString('pl-PL');
            
            // FILTR: Szukamy historii tego ćwiczenia, ale WYKLUCZAMY wpisy z dzisiaj (set.date !== today)
            const exerciseHistory = dataLog.filter(set => set.exercise === selectedExercise && set.date !== today);
            
            if (exerciseHistory.length === 0) { 
                infoBox.innerHTML = "ℹ️ BRAK_HISTORII: Brak sesji z poprzednich dni."; 
                return; 
            }
            
            // Pobieramy datę ostatniego historycznego treningu
            const lastDate = exerciseHistory[exerciseHistory.length - 1].date;
            const lastSessionSets = exerciseHistory.filter(set => set.date === lastDate);
            
            let html = `<strong>LAST_SESSION (${lastDate}):</strong><br>`;
            lastSessionSets.forEach((set, index) => { html += `S${index + 1}: ${set.reps} x ${set.weight}kg<br>`; });
            infoBox.innerHTML = html;
        }

        function autoFillInputs() {
            const selectedExercise = document.getElementById('exerciseSelect').value;
            if (!selectedExercise) {
                document.getElementById('repsInput').value = '';
                document.getElementById('weightInput').value = '';
                return;
            }
            const exerciseHistory = dataLog.filter(set => set.exercise === selectedExercise);
            if (exerciseHistory.length > 0) {
                const lastSet = exerciseHistory[exerciseHistory.length - 1];
                document.getElementById('repsInput').value = lastSet.reps;
                document.getElementById('weightInput').value = lastSet.weight;
            } else {
                document.getElementById('repsInput').value = '';
                document.getElementById('weightInput').value = '';
            }
        }

        function addExercise() {
            const input = document.getElementById('newExerciseName');
            const category = document.getElementById('newExerciseCategory').value;
            const name = input.value.trim();
            const exists = exercises.some(ex => ex.name.toLowerCase() === name.toLowerCase());
            if (name && !exists) {
                exercises.push({ name: name, category: category });
                saveExercises();
                input.value = '';
                init();
            } else if (exists) { alert("[ERROR] Ćwiczenie już istnieje."); }
        }

        function deleteExercise(index) {
            if(confirm(`Usunąć ćwiczenie: "${exercises[index].name}"?`)) {
                exercises.splice(index, 1);
                saveExercises();
                init();
            }
        }

        function renderCustomExercisesList() {
            const container = document.getElementById('customExercisesList');
            if(!container) return;
            container.innerHTML = '';
            exercises.forEach((ex, index) => {
                const div = document.createElement('div');
                div.className = 'flex-row';
                div.innerHTML = `<span><strong>${ex.name}</strong> <small style="color:#00aa33;">(${ex.category})</small></span> <button class="delete-btn" onclick="deleteExercise(${index})">USUŃ</button>`;
                container.appendChild(div);
            });
        }

        function addSet() {
            const exercise = document.getElementById('exerciseSelect').value;
            const weight = parseFloat(document.getElementById('weightInput').value);
            const reps = parseInt(document.getElementById('repsInput').value);
            const today = new Date().toLocaleDateString('pl-PL');
            if (!exercise || isNaN(weight) || isNaN(reps)) { alert("[ERROR] Wprowadź poprawne parametry serii."); return; }
            dataLog.push({ id: Date.now(), exercise, weight, reps, date: today });
            saveDataLog();
            renderTodaySets();
            // NIE odświeżamy widoku "Ostatnio" dzisiejszymi danymi – zostaje stary punkt odniesienia!
        }

        function deleteSet(setId) {
            if(confirm("Usunąć tę serię z logów?")) {
                dataLog = dataLog.filter(set => set.id !== setId);
                saveDataLog();
                renderTodaySets();
                renderHistory();
                onExerciseChange();
            }
        }

        function renderTodaySets() {
            const container = document.getElementById('todaySetsList');
            if(!container) return;
            container.innerHTML = '';
            const today = new Date().toLocaleDateString('pl-PL');
            const todaySets = dataLog.filter(set => set.date === today);
            if (todaySets.length === 0) { container.innerHTML = "<p style='color:#005511; font-size:12px;'>LOG_EMPTY: Brak serii z dzisiaj.</p>"; return; }
            todaySets.forEach(set => {
                const div = document.createElement('div');
                div.className = 'flex-row compact-row';
                div.innerHTML = `<span><strong>${set.exercise}</strong>: ${set.reps} x ${set.weight}kg</span> <button class="delete-btn" onclick="deleteSet(${set.id})">🗑️</button>`;
                container.appendChild(div);
            });
        }

        /* 2. MODYFIKACJA: GRUPOWANIE, SORTOWANIE I ZMIANA CZCIONEK W HISTORII */
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if(!container) return;
            container.innerHTML = '';
            if(dataLog.length === 0) { container.innerHTML = "<div class='card'><p style='color:gray;'>Baza danych historii jest pusta.</p></div>"; return; }
            
            // KROK A: Grupowanie logów po dacie treningu
            const groupedByDate = {};
            dataLog.forEach(set => {
                if(!groupedByDate[set.date]) groupedByDate[set.date] = [];
                groupedByDate[set.date].push(set);
            });
            
            // KROK B: Chronologiczne sortowanie dat od NAJNOWSZEJ do NAJSTARSZEJ
            const sortedDates = Object.keys(groupedByDate).sort((a,b) => {
                const partsA = a.split('.').reverse().join('');
                const partsB = b.split('.').reverse().join('');
                return partsB.localeCompare(partsA);
            });
            
            // KROK C: Renderowanie każdego dnia z uwzględnieniem nowej hierarchii partii i ćwiczeń
            sortedDates.forEach(date => {
                const sets = groupedByDate[date];
                const uniqueExercises = [...new Set(sets.map(s => s.exercise))].length;
                const totalReps = sets.reduce((sum, s) => sum + s.reps, 0);
                const totalVolume = sets.reduce((sum, s) => sum + (s.weight * s.reps), 0);
                
                // DWUPOZIOMOWE GRUPOWANIE: Każdy dzień dzielimy wewnętrznie na Partie -> Ćwiczenia
                const categoriesObj = {};
                sets.forEach(set => {
                    const foundEx = exercises.find(ex => ex.name === set.exercise);
                    const catName = foundEx ? foundEx.category : "Inne";
                    
                    if(!categoriesObj[catName]) categoriesObj[catName] = {};
                    if(!categoriesObj[catName][set.exercise]) categoriesObj[catName][set.exercise] = [];
                    
                    categoriesObj[catName][set.exercise].push(set);
                });

                const dayCard = document.createElement('div');
                dayCard.className = 'card clickable-card';
                dayCard.onclick = function(e) {
                    if (e.target.classList.contains('delete-btn')) return;
                    const content = this.querySelector('.collapse-content');
                    const arrow = this.querySelector('.arrow-indicator');
                    if (content.style.display === 'block') { content.style.display = 'none'; arrow.textContent = '🔽'; } 
                    else { content.style.display = 'block'; arrow.textContent = '🔼'; }
                };
                
                let html = `
                    <div class="history-header">
                        <h2 style="color:#00ff41; background:transparent; padding:0; margin:0;">📅 ${date}</h2>
                        <span class="arrow-indicator">🔽</span>
                    </div>
                    <div class="summary-box" style="margin-top:10px;">
                        CWICZEN: ${uniqueExercises} | SERII: ${sets.length}<br>
                        TOTAL_REPS: ${totalReps} | TONAZ: ${totalVolume.toFixed(1)} kg
                    </div>
                    <div class="collapse-content">
                `;
                
                // KROK D: Generowanie drzewa z nowymi rozmiarami czcionek
                Object.keys(categoriesObj).forEach(cat => {
                    // PARTIA CIAŁA: standardowa czcionka (14px), kolor Matrix-zielony, wielkie litery
                    html += `<div style="font-size: 14px; font-weight: bold; color: #00ff41; margin-top: 10px; text-transform: uppercase;">[${cat}]</div>`;
                    
                    Object.keys(categoriesObj[cat]).forEach(exName => {
                        // RODZAJ ĆWICZENIA: standard -1 (13px), kolor biały, lekkie wcięcie w prawo
                        html += `<div style="font-size: 13px; font-weight: bold; color: #ffffff; margin-left: 10px; margin-top: 4px;">> ${exName}:</div>`;
                        
                        categoriesObj[cat][exName].forEach((set, index) => {
                            // SERIE: standard -2 (11px), kolor ciemnozielony, mocne wcięcie w prawo
                            html += `
                                <div class="flex-row" style="font-size: 11px; border-color: #002200; padding: 4px 8px; margin-left: 20px; margin-top: 2px;">
                                    <span style="color: #00aa33;">S${index + 1}: ${set.reps} x ${set.weight}kg</span>
                                    <button class="delete-btn" onclick="deleteSet(${set.id})" style="font-size: 10px; padding: 2px 4px;">USUŃ</button>
                                </div>
                            `;
                        });
                    });
                });
                
                html += `</div>`;
                dayCard.innerHTML = html;
                container.appendChild(dayCard);
            });
        }

        // Kopia bezpieczeństwa plików
        function exportData() {
            const backupData = { categories: categories, exercises: exercises, dataLog: dataLog };
            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = new Date().toLocaleDateString('pl-PL').replace(/\./g, '-');
            a.download = `matrix_workout_backup_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.categories && imported.exercises && imported.dataLog) {
                        if (confirm("[DB_RESTORE] Czy zastąpić obecne logi systemowe plikiem kopii zapasowej?")) {
                            categories = imported.categories;
                            exercises = imported.exercises;
                            dataLog = imported.dataLog;
                            saveCategories(); saveExercises(); saveDataLog();
                            alert("[SUCCESS] Baza danych zsynchronizowana pomyślnie.");
                            window.location.reload();
                        }
                    } else { alert("[ERROR] Nieprawidłowa sygnatura pliku JSON."); }
                } catch (err) { alert("[ERROR] Plik uszkodzony."); }
            };
            reader.readAsText(file);
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
